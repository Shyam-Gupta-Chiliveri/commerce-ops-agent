[project]
name = "commerce-ops-agent"
version = "0.1.0"
description = "Portfolio agent: Shopify, Zendesk, Klaviyo, Anvyl and Sage into one warehouse."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opsagent = "opsagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
