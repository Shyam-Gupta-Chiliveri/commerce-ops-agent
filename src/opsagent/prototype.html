<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceae4;
    --ink: #141414;
    --muted: #5f5b55;
    --line: #d8d4cc;
    --panel: #f6f5f2;
    --white: #ffffff;
    --black: #111111;
    --hold: #8c2f2f;
    --ok: #1d6b45;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212;
    --ink: #f3f1ec;
    --muted: #b7b1a8;
    --line: #34322e;
    --panel: #1b1b1b;
    --white: #1f1f1f;
    --black: #f3f1ec;
    --hold: #f0a8a8;
    --ok: #8dcea8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font: 15px/1.5 "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  button, summary { font: inherit; color: inherit; }
  header {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 22px;
    background: var(--white);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
  .mark {
    width: 22px; height: 22px; background: var(--black); color: white;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
  }
  .name { font-weight: 600; letter-spacing: 0.16em; font-size: 13px; }
  .product { color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
  .howto { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
  .desk, .lang, .theme { border: 1px solid var(--line); }
  .desk, .lang { display: flex; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .desk button, .theme {
    border: 0; background: transparent; padding: 7px 10px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .desk button[aria-pressed="true"] { background: var(--black); color: var(--bg); }
  .theme { letter-spacing: 0.06em; font-size: 12px; }
  html[data-theme="dark"] .mark { color: #141414; }
  .lang { display: flex; border: 1px solid var(--line); }
  .lang button {
    border: 0; background: transparent; padding: 7px 12px; cursor: pointer; letter-spacing: 0.08em; font-size: 12px; font-weight: 600;
  }
  .lang button[aria-pressed="true"] { background: var(--black); color: var(--bg); }
  .app {
    display: flex;
    height: calc(100vh - 64px);
    min-width: 0;
  }
  #inbox { width: 300px; flex: 0 0 auto; }
  .work { flex: 1 1 auto; min-width: 280px; }
  #rail { width: 400px; flex: 0 0 auto; }
  aside, .work, .rail { min-height: 0; overflow: auto; }
  aside { background: var(--panel); }
  .rail { background: var(--panel); padding: 22px 20px 48px; }
  .split {
    flex: 0 0 10px;
    width: 10px;
    cursor: col-resize;
    touch-action: none;
    position: relative;
    background: transparent;
  }
  .split::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 4px;
    width: 1px;
    background: var(--line);
  }
  .split::after {
    content: "";
    position: absolute;
    top: 50%; left: 2px;
    width: 6px; height: 36px;
    transform: translateY(-50%);
    border-left: 1px solid #b7b2aa;
    border-right: 1px solid #b7b2aa;
    background: var(--bg);
  }
  .split:hover::before, .split:focus::before, .split.dragging::before {
    left: 3px; width: 3px; background: var(--black);
  }
  .pane-label {
    margin: 0; padding: 18px 18px 8px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .rail .pane-label { padding: 0 0 4px; }
  .proof-hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  button.ticket {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; cursor: pointer;
  }
  button.ticket[aria-pressed="true"] { background: var(--white); box-shadow: inset 3px 0 0 var(--black); }
  .who { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .tag { font-weight: 500; font-size: 12px; color: var(--muted); }
  .subject { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
  .work { padding: 28px 36px 56px; }
  .steps { display: flex; gap: 22px; list-style: none; margin: 0 0 26px; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .steps span {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid #141414;
    display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #ffffff; background: #141414;
  }
  html[data-theme="dark"] .steps span { background: #f3f1ec; color: #141414; border-color: #f3f1ec; }
  .app[hidden], .invoice-frame[hidden], .sheet[hidden] { display: none !important; }
  .invoice-frame { width: 100%; height: calc(100vh - 64px); border: 0; background: var(--bg); display: block; }
  .sheet { height: calc(100vh - 64px); overflow: auto; padding: 28px 40px 72px; }
  .sheet h1 { font-size: 28px; }
  .sheet .lead { margin: -8px 0 22px; color: var(--muted); max-width: 640px; }
  .bill { background: var(--white); border: 1px solid var(--line); padding: 16px 18px; margin: 0 0 12px; max-width: 760px; }
  .bill header { height: auto; padding: 0; border: 0; background: transparent; gap: 12px; margin-bottom: 8px; }
  .bill h2 { margin: 0; font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .metric { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 760px; margin: 0 0 18px; }
  .metric div { background: var(--white); border: 1px solid var(--line); padding: 14px 16px; }
  .metric b { display: block; font-size: 22px; letter-spacing: -0.03em; }
  .metric span, .issue { color: var(--muted); font-size: 13px; }
  .issue { margin: 0 0 8px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 22px 0 8px; }
  .section-head .kicker { margin: 0; }
  .jump { border: 1px solid var(--line); background: var(--white); padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .jump + .jump { margin-left: 8px; }
  .sheet.workspace { padding: 0; }
  .desk-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; padding: 22px 28px 0; }
  .desk-top h1 { margin: 0; font-size: 28px; }
  .desk-top .lead { margin: 6px 0 0; max-width: 520px; }
  .filters { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
  .filters button { flex: 1; border: 0; background: transparent; padding: 12px 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .filters button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--black); }
  .board { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
  .board-list { background: var(--panel); border-right: 1px solid var(--line); }
  .board-detail { padding: 32px 40px 64px; }
  .board-detail h1 { margin-top: 6px; }
  .supply-grid, .report-body { padding: 18px 28px 56px; }
  .supply-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .compare { background: var(--white); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
  .compare header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; height: auto; padding: 0; border: 0; background: transparent; margin: 0; }
  .sheet.workspace > .empty { padding: 28px; }
  .compare h2 { margin: 0; font-size: 18px; letter-spacing: 0; text-transform: none; }
  .bars { display: grid; gap: 8px; margin: 0; }
  .bars div { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .bars i { display: block; height: 8px; background: var(--ink); }
  .bars i.over { background: var(--hold); }
  .bars b { color: var(--ink); font-size: 14px; }
  .doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .door { text-align: left; background: var(--white); border: 1px solid var(--line); padding: 18px; cursor: pointer; color: inherit; }
  .door:hover { box-shadow: inset 3px 0 0 var(--black); }
  .door b { display: block; font-size: 28px; letter-spacing: -0.03em; margin: 8px 0 4px; }
  .door span { display: block; color: var(--muted); font-size: 13px; }
  .meaning { color: var(--ink); font-weight: 600; font-size: 15px; }
  .sources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  .sources div { background: var(--white); border: 1px solid var(--line); padding: 12px; }
  .sources b { display: block; font-size: 20px; }
  .sources span, .rank { display: block; color: var(--muted); font-size: 13px; }
  .sources .meaning, .door .meaning { color: var(--ink); }
  .report-body .kicker { margin-top: 22px; }
  .ranks { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
  .ranks li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: start; }
  .ranks b { display: block; font-size: 18px; line-height: 1; }
  .ranks i { display: block; height: 8px; background: var(--ink); margin-top: 6px; }
  .first { display: block; width: 100%; text-align: left; background: var(--white); border: 1px solid var(--line); border-left: 3px solid var(--hold); padding: 16px 18px; cursor: pointer; color: inherit; margin-bottom: 14px; }
  .first strong { display: block; font-size: 18px; margin: 4px 0; }
  .first span { color: var(--muted); font-size: 14px; }
  @media (max-width: 980px) {
    .board, .supply-grid, .doors, .sources { grid-template-columns: 1fr; }
    .board { min-height: 0; }
  }
  .kicker { margin: 0 0 6px; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; color: var(--muted); font-weight: 600; }
  h1 { margin: 0 0 18px; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; }
  .card { background: var(--white); border: 1px solid var(--line); padding: 18px 20px; margin: 0 0 14px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .customer { white-space: pre-wrap; margin: 0; }
  .draft-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .badge { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); padding: 4px 8px; }
  .reply { white-space: pre-wrap; margin: 12px 0 0; font-size: 15.5px; }
  .suggest { margin: 8px 0 0; padding: 0; list-style: none; }
  .suggest li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .proof { list-style: none; margin: 0; padding: 0; }
  .proof li {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px;
    position: relative;
    padding-bottom: 18px;
  }
  .proof li::before {
    content: "";
    position: absolute;
    left: 13px; top: 28px; bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .proof li:last-child::before { display: none; }
  .proof .n {
    width: 28px; height: 28px; border-radius: 50%;
    background: #141414; color: #ffffff;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; line-height: 1;
    position: relative; z-index: 1;
  }
  html[data-theme="dark"] .proof .n { background: #f3f1ec; color: #141414; }
  .step-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .step-title { margin: 2px 0 0; font-weight: 600; font-size: 15px; }
  .sys { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .status { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .status.hold { color: var(--hold); }
  .status.ok { color: var(--ok); }
  .fact { margin: 6px 0 0; font-size: 14px; }
  .fact + .fact { margin-top: 4px; }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.note { white-space: pre-wrap; font: 13px/1.45 "IBM Plex Sans", sans-serif; color: var(--muted); }
  .empty { color: var(--muted); }
  @media (max-width: 900px) {
    .howto { display: none; }
    .app { flex-direction: column; height: auto; }
    #inbox, #rail, .work { width: auto !important; flex: none; }
    .split { display: none; }
    .rail { border-top: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    header { height: auto; padding: 14px; flex-wrap: wrap; gap: 12px; }
    .work { padding: 20px 16px 40px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">H</span>
    <span class="name">HARBOR</span>
    <span class="product" id="productLabel">Agent</span>
  </div>
  <nav class="desk" id="desk" aria-label="Work">
    <button type="button" id="desk-tickets" aria-pressed="true">Tickets</button>
    <button type="button" id="desk-service" aria-pressed="false">Service</button>
    <button type="button" id="desk-supply" aria-pressed="false">Supply</button>
    <button type="button" id="desk-invoices" aria-pressed="false">Invoices</button>
    <button type="button" id="desk-report" aria-pressed="false">Report</button>
  </nav>
  <p class="howto" id="howto"></p>
  <div class="tools">
    <button type="button" id="theme" aria-pressed="false">Dark</button>
    <div class="lang" role="group" id="lang" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-de" aria-pressed="false">DE</button>
    </div>
  </div>
</header>
<div class="app" id="app">
  <aside id="inbox">
    <p class="pane-label" id="inboxLabel">Inbox</p>
    <div id="list"></div>
  </aside>
  <div class="split" id="split-inbox" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize inbox"></div>
  <main class="work" id="work">
    <p class="empty" id="loading">Opening the inbox…</p>
  </main>
  <div class="split" id="split-proof" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize proof"></div>
  <aside class="rail" id="rail" hidden>
    <p class="pane-label" id="checkedLabel">How the agent got here</p>
    <p class="proof-hint" id="proofHint"></p>
    <ol class="proof" id="sources"></ol>
  </aside>
</div>
<iframe class="invoice-frame" id="invoice-frame" hidden title="Invoice review"></iframe>
<main class="sheet" id="desk-page" hidden></main>

function esc(value) {
  return String(value ?? "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}
function t() { return copy[lang]; }
function day(value) { return String(value || "").slice(0, 10); }

function applyChrome() {
  document.documentElement.lang = lang === "de" ? "de" : "en";
  document.querySelector("#productLabel").textContent = t().product;
  const howto = {
    tickets: t().howto,
    service: t().howtoService,
    supply: t().howtoSupply,
    invoices: t().howtoInvoices,
    report: t().howtoReport
  };
  document.querySelector("#howto").textContent = howto[desk] || t().howto;
  syncInvoice();
  document.querySelector("#desk-tickets").textContent = t().tickets;
  document.querySelector("#desk-service").textContent = t().service;
  document.querySelector("#desk-supply").textContent = t().supply;
  document.querySelector("#desk-invoices").textContent = t().invoices;
  document.querySelector("#desk-report").textContent = t().report;
  const dark = theme === "dark";
  document.documentElement.dataset.theme = theme;
  document.querySelector("#theme").setAttribute("aria-pressed", dark ? "true" : "false");
  document.querySelector("#theme").textContent = dark ? t().light : t().dark;
  document.querySelector("#inboxLabel").textContent = t().inbox;
  document.querySelector("#checkedLabel").textContent = t().checked;
  document.querySelector("#proofHint").textContent = t().proofHint;
  document.querySelector("#split-inbox").setAttribute("aria-label", t().splitInbox);
  document.querySelector("#split-proof").setAttribute("aria-label", t().splitProof);
  document.querySelector("#lang-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  document.querySelector("#lang-de").setAttribute("aria-pressed", lang === "de" ? "true" : "false");
  document.querySelector("#lang").setAttribute("aria-label", lang === "de" ? "Sprache" : "Language");
}

function step(number, title, system, status, statusClass, facts) {
  const lines = facts.filter(Boolean).map((line) => `<p class="fact">${esc(line)}</p>`).join("");
  return `<li>
    <span class="n">${number}</span>
    <div>
      <div class="step-top"><p class="step-title">${esc(title)}</p><p class="status ${statusClass}">${esc(status)}</p></div>
      <p class="sys">${esc(system)}</p>
      ${lines}
    </div>
  </li>`;
}

function proofSteps(ticket) {
  const text = t();
  const intent = text.intents[ticket.intent] || text.intents.other;
  const shop = ticket.shopify;
  const supply = ticket.supply;
  const mails = (ticket.klaviyo || []).filter((row) => row.campaign || row.metric === "Received Email" || row.metric === "Refunded Order");
  const hold = supply && supply.decision === "INVESTIGATE";
  const codes = supply && supply.issue_codes ? supply.issue_codes.split(",").map((code) => code.trim()).filter(Boolean) : [];

  const shopFacts = shop
    ? [text.orderLine(
        shop.order_name,
        text.pay[shop.financial_status] || shop.financial_status,
        shop.fulfillment_status === "fulfilled" ? text.shipped : text.notShipped,
        shop.available > 0 ? text.stockIn(shop.available) : text.stockOut
      ), shop.title || ""]
    : [text.noShop];

  const mailFacts = mails.length
    ? mails.slice(-3).map((row) => text.mailLine(row.campaign || row.subject || row.metric, day(row.happened_at)))
    : [text.noEmail];

  let supplyFacts;
  let supplyStatus;
  let supplyClass;
  if (!supply) {
    supplyFacts = [text.noSupply];
    supplyStatus = text.none;
    supplyClass = "";
  } else if (hold) {
    supplyFacts = [text.supplyHold(supply.order_number, supply.supplier_name)]
      .concat(codes.map((code) => text.issues[code] || code))
      .concat([text.noDate]);
    supplyStatus = text.held;
    supplyClass = "hold";
  } else {
    supplyFacts = [text.supplyClear(supply.order_number, supply.supplier_name)];
    supplyStatus = text.clear;
    supplyClass = "ok";
  }

  const decisions = (ticket.actions || []).map((key) => text.actions[key] || key);
  const flags = ticket.fraud || [];
  const fraudFacts = flags.length
    ? flags.map((item) => `${item.source}: ${lang === "de" ? item.text_de : item.text_en}`)
    : [text.noFraud];
  const pipe = text.pipeline;
  return [
    step(1, pipe[0].title, pipe[0].system, text.read, "", [text.asked(ticket.first_name, intent, ticket.order_name || "—")]),
    step(2, pipe[1].title, pipe[1].system, flags.length ? text.checkThis : text.clear, flags.length ? "hold" : "ok", fraudFacts),
    step(3, pipe[2].title, pipe[2].system, shop ? text.found : text.missing, shop ? "ok" : "hold", shopFacts),
    step(4, pipe[3].title, pipe[3].system, mails.length ? text.already : text.none, "", mailFacts),
    step(5, pipe[4].title, pipe[4].system, supplyStatus, supplyClass, supplyFacts),
    step(6, pipe[5].title, pipe[5].system, text.suggested, "", decisions),
    step(7, pipe[6].title, pipe[6].system, text.notSent, "", [text.draftEnd])
  ].join("");
}

function renderList() {
  list.innerHTML = "";
  for (const ticket of tickets) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ticket";
    button.setAttribute("aria-pressed", current && current.ticket_id === ticket.ticket_id ? "true" : "false");
    const label = t().intents[ticket.intent] || t().intents.other;
    button.innerHTML = `<span class="who">${esc(ticket.first_name)} <span class="tag">${esc(label)}</span></span><span class="subject">${esc(ticket.order_name)} · ${esc(ticket.subject)}</span>`;
    button.addEventListener("click", () => openTicket(ticket.ticket_id, button));
    list.appendChild(button);
  }
}

function bindSplit(handle, pane, edge) {
  const key = pane.id;
  function setWidth(next) {
    const appWidth = document.querySelector("#app").getBoundingClientRect().width;
    const other = pane.id === "inbox" ? rail.getBoundingClientRect().width : inboxPane.getBoundingClientRect().width;
    const max = Math.max(220, appWidth - other - 320 - 20);
    const width = Math.round(Math.max(220, Math.min(next, max)));
    pane.style.width = width + "px";
    handle.setAttribute("aria-valuenow", String(width));
    const saved = JSON.parse(localStorage.getItem("harbor-panes") || "{}");
    saved[key] = width;
    localStorage.setItem("harbor-panes", JSON.stringify(saved));
  }
  handle.addEventListener("pointerdown", (event) => {
    if (window.matchMedia("(max-width: 900px)").matches) return;
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    handle.classList.add("dragging");
    const startX = event.clientX;
    const startW = pane.getBoundingClientRect().width;
    function move(e) {
      const dx = e.clientX - startX;
      setWidth(edge === "left" ? startW + dx : startW - dx);
    }
    function up() {
      handle.classList.remove("dragging");
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
    }
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
  handle.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    const currentWidth = pane.getBoundingClientRect().width;
    const delta = event.key === "ArrowRight" ? 24 : -24;
    setWidth(edge === "left" ? currentWidth + delta : currentWidth - delta);
  });
  handle.addEventListener("dblclick", () => setWidth(pane.id === "inbox" ? 300 : 400));
}

async function openTicket(id) {
  const ticket = await (await fetch("/api/tickets/" + id)).json();
  current = ticket;
  renderList();
  renderWork(ticket);
}

function setLang(next) {
  lang = next;
  localStorage.setItem("harbor-lang", lang);
  applyChrome();
  renderList();
  if (current) renderWork(current);
  if (desk === "service" && serviceRows) renderService();
  if (desk === "supply" && supplyRows) renderSupply();
  if (desk === "report" && reportData) renderReport();
}

function money(value) {
  const number = Number(value || 0);
  return number.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function qty(value) {
  const number = Number(value || 0);
  return Number.isInteger(number) ? String(number) : String(number);
}

function hotRow(row) {
  return Boolean(row.blocked_po) || row.intent === "fraud";
}

function renderService() {
  const page = document.querySelector("#desk-page");
  page.classList.add("workspace");
  if (!serviceRows) {
    page.innerHTML = `<p class="empty">${esc(t().loading)}</p>`;
    return;
  }
  const shown = serviceRows.filter((row) => {
    if (serviceFilter === "hot") return hotRow(row);
    if (serviceFilter === "clear") return !hotRow(row);
    return true;
  });
  if (!shown.some((row) => row.ticket_id === serviceFocus)) {
    const firstHot = serviceRows.find(hotRow);
    serviceFocus = (shown[0] || firstHot || serviceRows[0] || {}).ticket_id || null;
  }
  const selected = serviceRows.find((row) => row.ticket_id === serviceFocus) || shown[0];
  const counts = {
    all: serviceRows.length,
    hot: serviceRows.filter(hotRow).length,
    clear: serviceRows.filter((row) => !hotRow(row)).length
  };
  const filters = ["all", "hot", "clear"].map((name) => {
    const label = name === "all" ? t().allCustomers : name === "hot" ? t().attention : t().clear;
    return `<button type="button" data-filter="${name}" aria-pressed="${serviceFilter === name ? "true" : "false"}">${esc(label)} ${esc(counts[name])}</button>`;
  }).join("");
  const list = shown.map((row) => {
    const intent = (t().intents && t().intents[row.intent]) || row.intent;
    const state = row.intent === "fraud" ? t().intents.fraud : row.blocked_po ? t().held : t().clear;
    return `<button type="button" class="ticket" data-pick="${esc(row.ticket_id)}" aria-pressed="${row.ticket_id === serviceFocus ? "true" : "false"}">
      <span class="who"><span>${esc(row.first_name)}</span><span class="tag">${esc(state)}</span></span>
      <span class="subject">${esc(row.order_name)} · ${esc(intent)}</span>
    </button>`;
  }).join("");
  const intent = selected ? ((t().intents && t().intents[selected.intent]) || selected.intent) : "";
  const detail = !selected ? "" : selected.intent === "fraud"
    ? t().actions.do_not_pay_off_platform
    : selected.blocked_po
      ? t().supplyHold(selected.blocked_po, selected.supplier_name)
      : t().noSupply;
  const detailHtml = selected ? `
    <p class="kicker">${esc(selected.brand)}</p>
    <h1>${esc(selected.first_name)} · ${esc(selected.order_name)}</h1>
    <div class="card">
      <h2>${esc(t().askedFor)}</h2>
      <p class="customer">${esc(intent)}. ${esc(selected.subject)}</p>
    </div>
    <div class="card">
      <h2>${esc(t().doThis)}</h2>
      <p class="customer">${esc(detail)}</p>
    </div>
    <button type="button" class="jump" data-open="${esc(selected.ticket_id)}">${esc(t().openTicket)}</button>
    <p class="issue">${esc(t().person)}</p>` : `<p class="empty">${esc(t().loading)}</p>`;
  page.innerHTML = `<div class="board">
    <aside class="board-list">
      <div class="filters">${filters}</div>
      ${list || `<p class="empty" style="padding:18px">${esc(t().clear)}</p>`}
    </aside>
    <main class="board-detail">${detailHtml}</main>
  </div>`;
}

function renderSupply() {
  const page = document.querySelector("#desk-page");
  page.classList.add("workspace");
  if (!supplyRows) {
    page.innerHTML = `<p class="empty">${esc(t().loading)}</p>`;
    return;
  }
  const holds = supplyRows.filter((row) => row.decision === "INVESTIGATE").length;
  const cards = supplyRows.map((row) => {
    const hold = row.decision === "INVESTIGATE";
    const ordered = Number(row.ordered_qty || 0);
    const billed = Number(row.billed_qty || 0);
    const scale = Math.max(ordered, billed, 1);
    const reasons = (lang === "de" ? row.reasons_de : row.reasons_en);
    const why = reasons.length ? reasons.map((line) => `<p class="fact">${esc(line)}</p>`).join("") : `<p class="fact">${esc(t().canPay)}. ${esc(t().noPay)}</p>`;
    const people = (row.waiting || []).map((person) => `<button type="button" class="jump" data-open="${esc(person.ticket_id)}">${esc(person.first_name)} · ${esc(person.order_name)}</button>`).join("");
    return `<article class="compare">
      <header><h2>${esc(row.supplier)}</h2><span class="status ${hold ? "hold" : "ok"}">${esc(hold ? t().hold : t().canPay)}</span></header>
      <p class="issue">${esc(row.po_number)} · ${esc(row.bill_id)}</p>
      <div class="bars">
        <div><span>${esc(t().ordered)}</span><i style="width:${Math.round(ordered / scale * 100)}%"></i><b>${esc(qty(ordered))}</b></div>
        <div><span>${esc(t().billed)}</span><i class="${hold ? "over" : ""}" style="width:${Math.round(billed / scale * 100)}%"></i><b>${esc(qty(billed))}</b></div>
      </div>
      <p class="issue">EUR ${esc(money(row.ordered_net))} → ${esc(money(row.billed_net))}</p>
      ${why}
      ${people}
    </article>`;
  }).join("");
  page.innerHTML = `<div class="desk-top"><div><h1>${esc(t().supplyTitle)}</h1><p class="lead">${esc(t().howtoSupply)}</p></div><p class="issue">${esc(holds)} ${esc(t().hold)}</p></div><div class="supply-grid">${cards}</div>`;
}

function renderReport() {
  const page = document.querySelector("#desk-page");
  page.classList.add("workspace");
  if (!reportData) {
    page.innerHTML = `<p class="empty">${esc(t().loading)}</p>`;
    return;
  }
  const sync = reportData.sync;
  const service = reportData.service;
  const invoices = reportData.invoices;
  const holds = supplyRows ? supplyRows.filter((row) => row.decision === "INVESTIGATE").length : 0;
  const pays = supplyRows ? supplyRows.filter((row) => row.decision !== "INVESTIGATE").length : 0;
  const first = (service.blocked || [])[0];
  const banner = first ? `<button type="button" class="first" data-open="${esc(first.ticket_id)}">
      <span class="kicker">${esc(t().doFirst)}</span>
      <strong>${esc(first.first_name)} · ${esc(first.order_name)} · ${esc(first.blocked_po)}</strong>
      <span>${esc(first.supplier_name)}. ${esc(t().waiting)}</span>
    </button>` : "";
  const top = Math.max(...(invoices.issues || []).map((item) => item.count), 1);
  const ranks = (invoices.issues || []).map((item) => `<li><div><b>${esc(item.count)}</b><span>${esc(t().invoiceUnit)}</span></div><div><span class="rank">${esc(lang === "de" ? item.text_de : item.text_en)}</span><i style="width:${Math.round(item.count / top * 100)}%"></i></div></li>`).join("");
  const source = (count, pages, system, what) => `<div><b>${esc(count)}</b><span class="meaning">${esc(what)}</span><span>${esc(system)} · ${esc(t().readIn)} ${esc(pages)} ${esc(t().pages)}</span></div>`;
  page.innerHTML = `<div class="desk-top"><div><h1>${esc(t().reportTitle)}</h1><p class="lead">${esc(t().howtoReport)}</p></div></div>
    <div class="report-body">
      ${banner}
      <div class="doors">
        <button type="button" class="door" data-desk="service"><span class="kicker">${esc(t().serviceResult)}</span><b>${esc(service.open_tickets)}</b><span class="meaning">${esc(t().meanCustomers)}</span><span>${esc(service.grounded_passed)} ${esc(t().ofWord)} ${esc(service.grounded_total)} ${esc(t().draftsChecked)} EUR ${esc(money(service.cost_eur))}.</span></button>
        <button type="button" class="door" data-desk="supply"><span class="kicker">${esc(t().supplyResult)}</span><b>${esc(holds)}</b><span class="meaning">${esc(holds === 1 ? t().oneHold : t().manyHold)}</span><span>${esc(pays)} ${esc(t().otherCanPay)}.</span></button>
        <button type="button" class="door" data-desk="invoices"><span class="kicker">${esc(t().invoiceResult)}</span><b>${esc(invoices.documents)}</b><span class="meaning">${esc(t().meanDocs)}</span><span>${esc(invoices.investigate)} ${esc(t().onHoldDocs)} EUR ${esc(money(invoices.gross))}.</span></button>
      </div>
      <h2 class="kicker">${esc(t().loaded)}</h2>
      <div class="sources">
        ${source(sync.shopify_orders, sync.shopify_pages, "Shopify", t().shopOrders)}
        ${source(sync.zendesk_tickets, sync.zendesk_pages, "Zendesk", t().helpTickets)}
        ${source(sync.klaviyo_events, sync.klaviyo_pages, "Klaviyo", t().mailEvents)}
        ${source(sync.anvyl_orders, sync.anvyl_pages, "Anvyl", t().purchaseOrders)}
        ${source(sync.sage_bills, sync.sage_pages, "Sage", t().accountsBills)}
        <div><b>${esc(sync.ap_reviews)}</b><span class="meaning">${esc(t().invoiceFiles)}</span></div>
      </div>
      <h2 class="kicker">${esc(t().foundTitle)}</h2>
      <ol class="ranks">${ranks}</ol>
      <p class="issue">${esc(t().duplicate)}</p>
    </div>`;
}

function invoiceSrc() {
  const query = new URLSearchParams({
    host: "harbor",
    theme: theme,
    lang: lang === "de" ? "DE" : "EN"
  });
  return "/invoices/index.html?" + query.toString();
}

function syncInvoice() {
  const frame = document.querySelector("#invoice-frame");
  const win = frame && frame.contentWindow;
  if (!win || typeof win.harborSync !== "function") return;
  win.harborSync(lang === "de" ? "DE" : "EN", theme);
}

function setDesk(next) {
  desk = next;
  ["tickets", "service", "supply", "invoices", "report"].forEach((name) => {
    document.querySelector("#desk-" + name).setAttribute("aria-pressed", desk === name ? "true" : "false");
  });
  document.querySelector("#app").hidden = desk !== "tickets";
  const frame = document.querySelector("#invoice-frame");
  frame.hidden = desk !== "invoices";
  document.querySelector("#desk-page").hidden = desk === "tickets" || desk === "invoices";
  if (desk === "invoices" && frame.dataset.loaded !== "1") {
    frame.src = invoiceSrc();
    frame.dataset.loaded = "1";
  }
  if (desk === "service") loadService();
  if (desk === "supply") loadSupply();
  if (desk === "report") loadReport();
  applyChrome();
}

async function loadService() {
  if (!serviceRows) {
    renderService();
    serviceRows = await (await fetch("/api/service")).json();
  }
  if (desk === "service") renderService();
}

async function loadSupply() {
  if (!supplyRows) {
    renderSupply();
    supplyRows = await (await fetch("/api/supply")).json();
  }
  if (desk === "supply") renderSupply();
}

async function loadReport() {
  if (!reportData || !supplyRows) {
    renderReport();
    const jobs = [];
    if (!reportData) jobs.push(fetch("/api/report").then((response) => response.json()).then((data) => { reportData = data; }));
    if (!supplyRows) jobs.push(fetch("/api/supply").then((response) => response.json()).then((data) => { supplyRows = data; }));
    await Promise.all(jobs);
  }
  if (desk === "report") renderReport();
}

document.querySelector("#lang-en").addEventListener("click", () => setLang("en"));
document.querySelector("#lang-de").addEventListener("click", () => setLang("de"));
document.querySelector("#theme").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem("harbor-theme", theme);
  applyChrome();
});
document.querySelector("#desk-tickets").addEventListener("click", () => setDesk("tickets"));
document.querySelector("#desk-service").addEventListener("click", () => setDesk("service"));
document.querySelector("#desk-supply").addEventListener("click", () => setDesk("supply"));
document.querySelector("#desk-invoices").addEventListener("click", () => setDesk("invoices"));
document.querySelector("#desk-report").addEventListener("click", () => setDesk("report"));
document.querySelector("#desk-page").addEventListener("click", (event) => {
  const filter = event.target.closest("[data-filter]");
  const pick = event.target.closest("[data-pick]");
  const open = event.target.closest("[data-open]");
  const go = event.target.closest("[data-desk]");
  if (filter) {
    serviceFilter = filter.dataset.filter;
    renderService();
  } else if (pick) {
    serviceFocus = Number(pick.dataset.pick);
    renderService();
  } else if (open) {
    const id = Number(open.dataset.open);
    setDesk("tickets");
    openTicket(id);
  } else if (go) {
    setDesk(go.dataset.desk);
  }
});
document.querySelector("#invoice-frame").addEventListener("load", syncInvoice);

async function main() {
  applyChrome();
  document.querySelector("#loading").textContent = t().loading;
  const rows = await (await fetch("/api/tickets")).json();
  tickets = rows;
  renderList();
  await openTicket(44021);
}
main();
</script>
</body>
</html>
